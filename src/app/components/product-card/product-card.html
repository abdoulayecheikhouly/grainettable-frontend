<article class="product-card h-full">
  <a class="product-image-link" [routerLink]="['/produits', product().id]"
    ><img [src]="product().image" [alt]="product().name" loading="lazy" /><span
      class="stock-badge"
      [class.sold-out]="!product().stock"
      >{{ product().stock ? 'Disponible' : 'Épuisé' }}</span
    ></a
  >
  <div class="product-card-body flex flex-col gap-3 grow">
    <p class="caption category">{{ product().category_name }}</p>
    <h3>
      <a [routerLink]="['/produits', product().id]">{{ product().name }}</a>
    </h3>
    <strong>{{ money(product().price) }}</strong
    ><a class="product-detail-link" [routerLink]="['/produits', product().id]"
      >Voir le produit <span aria-hidden="true">↗</span></a
    ><button mat-flat-button [disabled]="product().stock === 0" (click)="add.emit(product())">
      {{ product().stock ? 'Ajouter au panier' : 'Indisponible' }}
    </button>
  </div>
</article>
